<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presente Rosa</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <nav id="navbar">
            <div class="logo">Presente Rosa</div>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#apps">Aplicações</a></li>
            </ul>
        </nav>
    </header>

    <main id="home">
        <section class="hero">
            <div class="container">
                <div class="photo-frame">
                    <img src="IMG_20250306_150942746_HDR.jpg" alt="Minha Namorada">
                </div>
                <p class="intro-text">
                    Aqui, vou colocar todo tipo de 
                    aplicação que me pedir
                </p>
            </div>
        </section>

        <section id="apps" class="grid-apps">
            <div class="card">
                <h3>Lista de Bairros</h3>
                <p>Quase completo<br>Falta você julgar</p>
                <button class="btn-rosa btn-resultado" type="button">Acessar</button>
            </div>
            <div class="card">
                <h3>Aplicação 2</h3>
                <p>O que quer que você imagine, eu desenvolvo aqui.</p>
                <button class="btn-rosa" type="button">Acessar</button>
            </div>
        </section>
    </main>

    <footer>
        <p>Eu te amo <span class="heart">💗</span></p>
    </footer>    
</body>
</html>
